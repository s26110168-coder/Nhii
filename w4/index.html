<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Dream Portfolio | 我的網頁作品集</title>
    <!-- 引入可愛與現代感 Google 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* === 全局樣式重置與甜美粉紅背景 === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* 甜美柔和的粉紅漸層背景 */
            background: linear-gradient(135deg, #ffeef8 0%, #ffd6e8 50%, #fec5bb 100%);
            background-attachment: fixed;
            color: #5c3d46;
            font-family: 'Noto Sans TC', 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景飄浮可愛光暈裝飾 */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 182, 193, 0.4);
            filter: blur(80px);
            z-index: 0;
        }

        body::before {
            top: 10%;
            left: 5%;
        }

        body::after {
            bottom: 10%;
            right: 5%;
            background: rgba(255, 105, 180, 0.25);
        }

        /* 主容器 */
        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
            position: relative;
            z-index: 1;
        }

        /* === 個人頭像與個人檔案區 === */
        .profile-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* 大頭貼粉紅光暈與旋轉外圈動畫 */
        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(45deg, #ff758c, #ff7eb3, #ffb3c6);
            background-size: 200% 200%;
            animation: pinkGlowRotate 4s ease infinite;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.4);
            margin-bottom: 15px;
        }

        @keyframes pinkGlowRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            background-color: #fff0f5;
        }

        .user-name {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #d63384;
            text-shadow: 2px 2px 0px #ffffff, 0 0 15px rgba(255, 105, 180, 0.3);
            margin-bottom: 5px;
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
        }

        .user-subtitle {
            font-size: 0.95rem;
            color: #ff4d6d;
            letter-spacing: 2px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            box-shadow: 0 2px 8px rgba(255, 182, 193, 0.3);
        }

        /* === 網格選單區 (16個按鈕) === */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 電腦版 4 欄 */
            gap: 20px;
            width: 100%;
        }

        /* 基礎按鈕卡片樣式 */
        .card {
            position: relative;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid rgba(255, 182, 193, 0.6);
            border-radius: 18px;
            padding: 22px 15px;
            text-decoration: none;
            color: #5c3d46;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 110px;
            backdrop-filter: blur(10px);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            box-shadow: 0 8px 15px rgba(255, 182, 193, 0.2);
        }

        /* === 已解鎖按鈕 (Unlocked Card) === */
        .card.unlocked {
            background: rgba(255, 255, 255, 0.85);
            border-color: #ff85a2;
            cursor: pointer;
        }

        .card.unlocked::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 182, 193, 0.4), transparent);
            transition: 0.5s;
        }

        /* 已解鎖按鈕 Hover 酷炫粉紅懸浮動畫 */
        .card.unlocked:hover {
            transform: translateY(-8px) scale(1.04);
            border-color: #ff4d6d;
            background: #ffffff;
            box-shadow: 0 12px 25px rgba(255, 77, 109, 0.35),
                        0 0 15px rgba(255, 182, 193, 0.5);
        }

        .card.unlocked:hover::before {
            left: 100%;
        }
